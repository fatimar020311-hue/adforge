<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdForge — AI Marketing Content Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171F; --panel:#1C2030; --panel-2:#232840; --text:#EAEAF0; --dim:#9497AA;
    --coral:#FF6B4A; --teal:#4ECDC4; --line: rgba(234,234,240,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;}
  .wrap{max-width:920px; margin:0 auto; padding:48px 24px 90px;}
  header{margin-bottom:28px;}
  .logo{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .logo-mark{width:28px; height:28px; border-radius:7px; background:linear-gradient(135deg,var(--coral),var(--teal));}
  h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:30px; margin:0; letter-spacing:-0.5px;}
  .tag{color:var(--dim); font-size:15px; margin:0;}

  .panel{background:var(--panel); border-radius:14px; padding:28px; border:1px solid var(--line);}
  label{display:block; font-size:12.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--dim); margin-bottom:8px; font-weight:600;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid .full{grid-column:1/-1;}
  @media (max-width:600px){.grid{grid-template-columns:1fr;}}
  input[type=text], textarea, select{
    width:100%; background:rgba(0,0,0,0.25); border:1px solid var(--line); color:var(--text);
    padding:12px 14px; border-radius:9px; font-size:14.5px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:70px;}
  input::placeholder, textarea::placeholder{color:rgba(234,234,240,0.3);}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--coral); outline-offset:1px;}
  select option{background:var(--panel);}
  button.primary{
    margin-top:22px; background:var(--coral); color:#1A0E0A; border:none; font-weight:700;
    font-size:15px; padding:14px 28px; border-radius:9px; cursor:pointer; font-family:inherit;
  }
  button.primary:hover{background:#ff8065;}
  button.primary:disabled{opacity:0.5; cursor:not-allowed;}
  .status{margin-top:14px; font-size:14px; color:var(--dim); min-height:20px;}
  .error{color:#FF8B8B;}

  .section{margin-top:38px;}
  .section h2{font-family:'Space Grotesk',sans-serif; font-size:19px; color:var(--teal); margin:0 0 16px; font-weight:700;}
  .card{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; position:relative;}
  .card .label{font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--coral); font-weight:700; margin-bottom:8px;}
  .card .headline{font-weight:600; font-size:15.5px; margin-bottom:6px; line-height:1.4;}
  .card .body{font-size:14px; color:var(--dim); line-height:1.6; margin-bottom:8px;}
  .card .cta{display:inline-block; font-size:13px; font-weight:600; color:var(--teal); background:rgba(78,205,196,0.1); padding:4px 10px; border-radius:6px;}
  .copy-btn{position:absolute; top:14px; right:14px; background:rgba(255,255,255,0.06); border:1px solid var(--line); color:var(--dim); font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer; font-family:inherit;}
  .copy-btn:hover{color:var(--text); border-color:var(--teal);}
  .copy-btn.copied{color:var(--teal); border-color:var(--teal);}
  .caption-text{font-size:14.5px; line-height:1.6; margin-bottom:8px; white-space:pre-wrap;}
  .hashtags{font-size:13px; color:var(--teal);}
  footer{margin-top:56px; font-size:12px; color:var(--dim); text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><div class="logo-mark"></div><h1>AdForge</h1></div>
    <p class="tag">Describe your business once. Get ad copy, social captions, and content ideas ready to post.</p>
  </header>

  <div class="panel" id="formPanel">
    <div class="grid">
      <div>
        <label for="bizname">Business name</label>
        <input type="text" id="bizname" placeholder="e.g. Coastal Coffee Co." />
      </div>
      <div>
        <label for="industry">Industry / niche</label>
        <input type="text" id="industry" placeholder="e.g. specialty coffee shop" />
      </div>
      <div class="full">
        <label for="offer">What are you promoting?</label>
        <textarea id="offer" placeholder="e.g. New oat-milk latte launch, 20% off this weekend for first-time customers"></textarea>
      </div>
      <div>
        <label for="tone">Tone</label>
        <select id="tone">
          <option>Friendly & casual</option>
          <option>Professional & polished</option>
          <option>Bold & energetic</option>
          <option>Luxury & minimal</option>
          <option>Playful & funny</option>
        </select>
      </div>
      <div>
        <label for="platform">Primary platform</label>
        <select id="platform">
          <option>Instagram</option>
          <option>Facebook</option>
          <option>LinkedIn</option>
          <option>Google Ads</option>
          <option>Email</option>
        </select>
      </div>
    </div>
    <button class="primary" id="generateBtn">Generate content</button>
    <div class="status" id="status"></div>
  </div>

  <div id="results"></div>

  <footer>AdForge — an AI marketing assistant. Review generated content before publishing; AI can make mistakes.</footer>
</div>

<script>
const API_ENDPOINT = '/api/generate';
const generateBtn = document.getElementById('generateBtn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

generateBtn.addEventListener('click', generate);

async function generate(){
  const bizname = document.getElementById('bizname').value.trim();
  const industry = document.getElementById('industry').value.trim();
  const offer = document.getElementById('offer').value.trim();
  const tone = document.getElementById('tone').value;
  const platform = document.getElementById('platform').value;

  if(!bizname || !offer){
    statusEl.className = 'status error';
    statusEl.textContent = "Fill in at least your business name and what you're promoting.";
    return;
  }

  statusEl.className = 'status';
  statusEl.textContent = 'Writing your content set…';
  generateBtn.disabled = true;
  resultsEl.innerHTML = '';

  try{
    const response = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ businessInput: { bizname, industry, offer, tone, platform } })
    });
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || 'Request failed');

    render(data.result);
    statusEl.textContent = '';
  } catch(err){
    console.error(err);
    statusEl.className = 'status error';
    statusEl.textContent = "Couldn't generate that content set. Try again in a moment.";
  } finally {
    generateBtn.disabled = false;
  }
}

function render(set){
  resultsEl.innerHTML = '';
  resultsEl.appendChild(adsSection(set.ads));
  resultsEl.appendChild(captionsSection(set.captions));
  resultsEl.appendChild(ideasSection(set.ideas));
}
function adsSection(ads){
  const div = document.createElement('div');
  div.className = 'section';
  div.innerHTML = `<h2>Ad copy</h2>`;
  ads.forEach((ad,i)=>{
    const card=document.createElement('div'); card.className='card';
    const fullText=`${ad.headline}\n\n${ad.body}\n\n${ad.cta}`;
    card.innerHTML=`<button class="copy-btn" data-copy="${escapeAttr(fullText)}">Copy</button>
      <div class="label">Variation ${i+1}</div>
      <div class="headline">${escapeHtml(ad.headline)}</div>
      <div class="body">${escapeHtml(ad.body)}</div>
      <span class="cta">${escapeHtml(ad.cta)}</span>`;
    div.appendChild(card);
  });
  wireCopyButtons(div); return div;
}
function captionsSection(captions){
  const div=document.createElement('div'); div.className='section';
  div.innerHTML=`<h2>Social captions</h2>`;
  captions.forEach((c,i)=>{
    const card=document.createElement('div'); card.className='card';
    const fullText=`${c.text}\n\n${c.hashtags}`;
    card.innerHTML=`<button class="copy-btn" data-copy="${escapeAttr(fullText)}">Copy</button>
      <div class="label">Caption ${i+1}</div>
      <div class="caption-text">${escapeHtml(c.text)}</div>
      <div class="hashtags">${escapeHtml(c.hashtags)}</div>`;
    div.appendChild(card);
  });
  wireCopyButtons(div); return div;
}
function ideasSection(ideas){
  const div=document.createElement('div'); div.className='section';
  div.innerHTML=`<h2>Future content ideas</h2>`;
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<ul style="margin:0;padding-left:18px;color:var(--text);font-size:14.5px;line-height:1.9;">'+
    ideas.map(i=>`<li>${escapeHtml(i)}</li>`).join('')+'</ul>';
  div.appendChild(card); return div;
}
function wireCopyButtons(container){
  container.querySelectorAll('.copy-btn').forEach(b=>{
    b.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(b.dataset.copy);
        b.textContent='Copied'; b.classList.add('copied');
        setTimeout(()=>{ b.textContent='Copy'; b.classList.remove('copied'); },1500);
      }catch(e){ b.textContent='Select text'; }
    });
  });
}
function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;'); }
</script>
</body>
</html>
